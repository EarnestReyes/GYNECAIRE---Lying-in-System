<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="975" viewBox="0 0 1110 975" role="img" aria-label="GYNECAIRE system architecture"><title>GYNECAIRE system architecture</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">GYNECAIRE system architecture</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M320 202V202H780V202" marker-end="url(#arrow)"/><rect x="528.4" y="180" width="43.2" height="20" fill="#fffafd"/><text text-anchor="middle" x="550" y="195" class="note">Auth</text><path class="edge" d="M690 202V202H780V202" marker-end="url(#arrow)"/><rect x="713.4" y="180" width="43.2" height="20" fill="#fffafd"/><text text-anchor="middle" x="735" y="195" class="note">Auth</text><path class="edge" d="M180 254V302H550V350" marker-end="url(#arrow)"/><rect x="321.5" y="280" width="87" height="20" fill="#fffafd"/><text text-anchor="middle" x="365" y="295" class="note">bearer JWT</text><path class="edge" d="M550 254V350" marker-end="url(#arrow)"/><rect x="506.5" y="280" width="87" height="20" fill="#fffafd"/><text text-anchor="middle" x="550" y="295" class="note">bearer JWT</text><path class="edge" d="M550 454V507H180V560" marker-end="url(#arrow)"/><rect x="295.95" y="485" width="138.1" height="20" fill="#fffafd"/><text text-anchor="middle" x="365" y="500" class="note">parameterized SQL</text><path class="edge" d="M550 454V560" marker-end="url(#arrow)"/><rect x="480.95" y="485" width="138.1" height="20" fill="#fffafd"/><text text-anchor="middle" x="550" y="500" class="note">server credential</text><path class="edge" d="M550 454V507H920V560" marker-end="url(#arrow)"/><rect x="680.55" y="485" width="108.89999999999999" height="20" fill="#fffafd"/><text text-anchor="middle" x="735" y="500" class="note">gated imports</text><rect class="node"  x="40" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="180" y="196"><tspan x="180" dy="0">Patient: Expo 58 / React Native</tspan><tspan x="180" dy="18">mobile</tspan></text><rect class="node"  x="410" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="550" y="196"><tspan x="550" dy="0">Active staff: React / Vite web</tspan><tspan x="550" dy="18">portal</tspan></text><rect class="node"  x="780" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="920" y="196"><tspan x="920" dy="0">Supabase Auth: sessions, email</tspan><tspan x="920" dy="18">and JWT</tspan></text><rect class="node"  x="410" y="350" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="550" y="396"><tspan x="550" dy="0">Express 5: verify JWT, active</tspan><tspan x="550" dy="18">role and ownership</tspan></text><path class="node"  d="M40 578a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="180" cy="578" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="180" y="606"><tspan x="180" dy="0">PostgreSQL: 13 public tables;</tspan><tspan x="180" dy="18">RLS enabled</tspan></text><path class="node"  d="M410 578a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="550" cy="578" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="550" y="606"><tspan x="550" dy="0">Private staff-avatars:</tspan><tspan x="550" dy="18">backend-only sign/write/delete</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="780" y="560" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="920" y="606"><tspan x="920" dy="0">Import scanner and encryption</tspan><tspan x="920" dy="18">prerequisites</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="410" y="770" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="550" y="807"><tspan x="550" dy="0">Clinical records / stock /</tspan><tspan x="550" dy="18">messages / notifications: no</tspan><tspan x="550" dy="18">backend</tspan></text><text x="30" y="957" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>