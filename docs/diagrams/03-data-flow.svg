<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="985" viewBox="0 0 1120 985" role="img" aria-label="Data flow: entities, processes and stores"><title>Data flow: entities, processes and stores</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Data flow: entities, processes and stores</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M170 254V350" marker-end="url(#arrow)"/><rect x="122.85" y="280" width="94.3" height="20" fill="#fffafd"/><text text-anchor="middle" x="170" y="295" class="note">account JWT</text><path class="edge" d="M550 254V350" marker-end="url(#arrow)"/><rect x="510.15" y="280" width="79.7" height="20" fill="#fffafd"/><text text-anchor="middle" x="550" y="295" class="note">staff JWT</text><path class="edge" d="M930 254V302H550V350" marker-end="url(#arrow)"/><rect x="678.25" y="280" width="123.5" height="20" fill="#fffafd"/><text text-anchor="middle" x="740" y="295" class="note">verified claims</text><path class="edge" d="M170 454V512H360V570" marker-end="url(#arrow)"/><rect x="192.3" y="490" width="145.4" height="20" fill="#fffafd"/><text text-anchor="middle" x="265" y="505" class="note">own account / care</text><path class="edge" d="M550 454V512H360V570" marker-end="url(#arrow)"/><rect x="371.35" y="490" width="167.29999999999998" height="20" fill="#fffafd"/><text text-anchor="middle" x="455" y="505" class="note">authorized read/write</text><path class="edge" d="M690 402V402H790V402" marker-end="url(#arrow)"/><rect x="641.75" y="380" width="196.5" height="20" fill="#fffafd"/><text text-anchor="middle" x="740" y="395" class="note">admin import / own avatar</text><path class="edge" d="M930 454V570" marker-end="url(#arrow)"/><rect x="860.95" y="490" width="138.1" height="20" fill="#fffafd"/><text text-anchor="middle" x="930" y="505" class="note">validated content</text><path class="edge" d="M360 674V780" marker-end="url(#arrow)"/><rect x="283.65" y="705" width="152.7" height="20" fill="#fffafd"/><text text-anchor="middle" x="360" y="720" class="note">transactional audit</text><rect class="node"  x="30" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="170" y="196"><tspan x="170" dy="0">External entity: mobile account</tspan><tspan x="170" dy="18">/ guest</tspan></text><rect class="node"  x="410" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="550" y="196"><tspan x="550" dy="0">External entity: staff /</tspan><tspan x="550" dy="18">administrator</tspan></text><rect class="node"  x="790" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="930" y="196"><tspan x="930" dy="0">External identity provider:</tspan><tspan x="930" dy="18">Supabase Auth</tspan></text><ellipse class="node"  cx="170" cy="402" rx="140" ry="52"/><text class="label" text-anchor="middle" x="170" y="396"><tspan x="170" dy="0">P1 Account and linked-care</tspan><tspan x="170" dy="18">authorization</tspan></text><ellipse class="node"  cx="550" cy="402" rx="140" ry="52"/><text class="label" text-anchor="middle" x="550" y="396"><tspan x="550" dy="0">P2 Staff workflows and admin</tspan><tspan x="550" dy="18">controls</tspan></text><path class="node"  d="M220 588a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="360" cy="588" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="360" y="625"><tspan x="360" dy="0">D1 Public application database</tspan></text><ellipse class="node"  cx="930" cy="402" rx="140" ry="52"/><text class="label" text-anchor="middle" x="930" y="396"><tspan x="930" dy="0">P3 Validate / decode / scan</tspan><tspan x="930" dy="18">files</tspan></text><path class="node"  d="M790 588a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="930" cy="588" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="930" y="616"><tspan x="930" dy="0">D2 Private avatar objects;</tspan><tspan x="930" dy="18">encrypted import DB staging</tspan></text><path class="node"  d="M220 798a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="360" cy="798" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="360" y="826"><tspan x="360" dy="0">D3 Audit metadata and import</tspan><tspan x="360" dy="18">events</tspan></text><text x="30" y="967" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>