<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="1365" viewBox="0 0 1410 1365" role="img" aria-label="Authentication and account routing"><title>Authentication and account routing</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Authentication and account routing</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M510 234V290" marker-end="url(#arrow)"/><path class="edge" d="M510 394V450" marker-end="url(#arrow)"/><path class="edge" d="M510 554V610" marker-end="url(#arrow)"/><path class="edge" d="M510 714V780" marker-end="url(#arrow)"/><path class="edge" d="M510 884V927H170V970" marker-end="url(#arrow)"/><rect x="325.7" y="905" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="340" y="920" class="note">No</text><path class="edge" d="M510 884V927H850V970" marker-end="url(#arrow)"/><rect x="662.05" y="905" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="680" y="920" class="note">Yes</text><path class="edge" d="M850 1074V1160" marker-end="url(#arrow)"/><rect x="832.05" y="1095" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="850" y="1110" class="note">Yes</text><path class="edge" d="M850 1074V1117H1220V1160" marker-end="url(#arrow)"/><rect x="1020.7" y="1095" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="1035" y="1110" class="note">No</text><path class="edge" d="M170 1074V1160" marker-end="url(#arrow)"/><rect class="node"  x="370" y="130" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="510" y="185"><tspan x="510" dy="0">Open mobile or staff portal</tspan></text><polygon class="node"  points="390,290 650,290 630,394 370,394"/><text class="label" text-anchor="middle" x="510" y="336"><tspan x="510" dy="0">Credentials / signup / recovery</tspan><tspan x="510" dy="18">callback</tspan></text><rect class="node"  x="370" y="450" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="510" y="496"><tspan x="510" dy="0">Supabase Auth validates and</tspan><tspan x="510" dy="18">issues session</tspan></text><rect class="node"  x="370" y="610" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="510" y="656"><tspan x="510" dy="0">Express verifies signature,</tspan><tspan x="510" dy="18">issuer and audience</tspan></text><polygon class="node"  points="510,770 660,832 510,894 360,832"/><text class="label" text-anchor="middle" x="510" y="835"><tspan x="510" dy="0">Staff portal request?</tspan></text><rect class="node"  x="30" y="970" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="170" y="1016"><tspan x="170" dy="0">Read own profile and account</tspan><tspan x="170" dy="18">route</tspan></text><polygon class="node"  points="850,960 1000,1022 850,1084 700,1022"/><text class="label" text-anchor="middle" x="850" y="1016"><tspan x="850" dy="0">Active staff membership and</tspan><tspan x="850" dy="18">staff/admin profile?</tspan></text><rect class="node"  x="710" y="1160" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="850" y="1215"><tspan x="850" dy="0">Load permitted staff portal</tspan></text><rect class="node"  x="1080" y="1160" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="1220" y="1215"><tspan x="1220" dy="0">Deny staff access</tspan></text><rect class="node"  x="30" y="1160" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="170" y="1206"><tspan x="170" dy="0">General or linked-patient</tspan><tspan x="170" dy="18">experience</tspan></text><text x="30" y="1347" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>