<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1685" viewBox="0 0 1490 1685" role="img" aria-label="Registration and patient verification"><title>Registration and patient verification</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Registration and patient verification</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M500 234V290" marker-end="url(#arrow)"/><path class="edge" d="M500 394V450" marker-end="url(#arrow)"/><path class="edge" d="M500 554V602H150V650" marker-end="url(#arrow)"/><rect x="310.7" y="580" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="325" y="595" class="note">No</text><path class="edge" d="M500 554V602H850V650" marker-end="url(#arrow)"/><rect x="657.05" y="580" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="675" y="595" class="note">Yes</text><path class="edge" d="M850 754V810" marker-end="url(#arrow)"/><path class="edge" d="M850 914V970" marker-end="url(#arrow)"/><path class="edge" d="M850 1074V1117H1210V1160" marker-end="url(#arrow)"/><rect x="1001.1" y="1095" width="57.8" height="20" fill="#fffafd"/><text text-anchor="middle" x="1030" y="1110" class="note">Reject</text><path class="edge" d="M850 1074V1117H500V1160" marker-end="url(#arrow)"/><rect x="642.45" y="1095" width="65.1" height="20" fill="#fffafd"/><text text-anchor="middle" x="675" y="1110" class="note">Approve</text><path class="edge" d="M500 1264V1320" marker-end="url(#arrow)"/><rect x="405.4" y="1270" width="189.2" height="20" fill="#fffafd"/><text text-anchor="middle" x="500" y="1285" class="note">link conflict rolls back</text><path class="edge" d="M500 1424V1480" marker-end="url(#arrow)"/><path class="edge" d="M1210 1264V1320" marker-end="url(#arrow)"/><path class="edge" d="M1210 1424H1410V628H850V650" marker-end="url(#arrow)"/><rect x="1373.8" y="1015" width="72.4" height="20" fill="#fffafd"/><text text-anchor="middle" x="1410" y="1030" class="note">resubmit</text><rect class="node"  x="360" y="130" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="500" y="176"><tspan x="500" dy="0">Welcome / guest / choose</tspan><tspan x="500" dy="18">account intent</tspan></text><rect class="node"  x="360" y="290" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="500" y="336"><tspan x="500" dy="0">Register with Supabase Auth;</tspan><tspan x="500" dy="18">trigger creates general profile</tspan></text><polygon class="node"  points="500,440 650,502 500,564 350,502"/><text class="label" text-anchor="middle" x="500" y="496"><tspan x="500" dy="0">Request clinic patient</tspan><tspan x="500" dy="18">verification?</tspan></text><rect class="node"  x="10" y="650" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="150" y="696"><tspan x="150" dy="0">General User / education /</tspan><tspan x="150" dy="18">preferences</tspan></text><polygon class="node"  points="730,650 990,650 970,754 710,754"/><text class="label" text-anchor="middle" x="850" y="696"><tspan x="850" dy="0">Submit demographics,</tspan><tspan x="850" dy="18">new/existing intent and consent</tspan></text><rect class="node"  x="710" y="810" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="850" y="856"><tspan x="850" dy="0">Persist pending request; no</tspan><tspan x="850" dy="18">patient privileges</tspan></text><polygon class="node"  points="850,960 1000,1022 850,1084 700,1022"/><text class="label" text-anchor="middle" x="850" y="1025"><tspan x="850" dy="0">Active staff reviews request</tspan></text><rect class="node"  x="1070" y="1160" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="1210" y="1215"><tspan x="1210" dy="0">Reject; account remains general</tspan></text><rect class="node"  x="360" y="1160" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="500" y="1206"><tspan x="500" dy="0">Approve: select/create patient;</tspan><tspan x="500" dy="18">lock and link profile</tspan></text><path class="node"  d="M360 1338a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="500" cy="1338" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="500" y="1366"><tspan x="500" dy="0">Commit verification, account</tspan><tspan x="500" dy="18">category and audit</tspan></text><rect class="node"  x="360" y="1480" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="500" y="1535"><tspan x="500" dy="0">Linked patient care reads</tspan></text><rect class="node"  x="1070" y="1320" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="1210" y="1366"><tspan x="1210" dy="0">Controlled resubmission after</tspan><tspan x="1210" dy="18">rejection</tspan></text><text x="30" y="1667" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>