<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1335" viewBox="0 0 1040 1335" role="img" aria-label="Current appointment workflow and gaps"><title>Current appointment workflow and gaps</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Current appointment workflow and gaps</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M500 234V290" marker-end="url(#arrow)"/><path class="edge" d="M500 394V450" marker-end="url(#arrow)"/><path class="edge" d="M500 554V602H150V650" marker-end="url(#arrow)"/><rect x="310.7" y="580" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="325" y="595" class="note">No</text><path class="edge" d="M500 554V602H850V650" marker-end="url(#arrow)"/><rect x="657.05" y="580" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="675" y="595" class="note">Yes</text><path class="edge" d="M850 754V810" marker-end="url(#arrow)"/><path class="edge" d="M850 914V970" marker-end="url(#arrow)"/><rect class="node"  x="360" y="130" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="500" y="185"><tspan x="500" dy="0">Active staff opens appointments</tspan></text><polygon class="node"  points="380,290 640,290 620,394 360,394"/><text class="label" text-anchor="middle" x="500" y="336"><tspan x="500" dy="0">Select existing patient,</tspan><tspan x="500" dy="18">service, time and status</tspan></text><polygon class="node"  points="500,440 650,502 500,564 350,502"/><text class="label" text-anchor="middle" x="500" y="496"><tspan x="500" dy="0">Service in fixed API enum and</tspan><tspan x="500" dy="18">input valid?</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="10" y="650" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="150" y="696"><tspan x="150" dy="0">Reject invalid/custom service;</tspan><tspan x="150" dy="18">known configuration mismatch</tspan></text><rect class="node"  x="710" y="650" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="850" y="696"><tspan x="850" dy="0">Parameterized transaction:</tspan><tspan x="850" dy="18">appointment and audit</tspan></text><path class="node"  d="M710 828a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="850" cy="828" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="850" y="847"><tspan x="850" dy="0">appointments: pending /</tspan><tspan x="850" dy="18">confirmed / completed /</tspan><tspan x="850" dy="18">cancelled</tspan></text><rect class="node"  x="710" y="970" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="850" y="1016"><tspan x="850" dy="0">Linked mobile account reads own</tspan><tspan x="850" dy="18">schedule only</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="710" y="1130" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="850" y="1167"><tspan x="850" dy="0">Patient self-booking, policy</tspan><tspan x="850" dy="18">enforcement and clinical chart</tspan><tspan x="850" dy="18">unavailable</tspan></text><text x="30" y="1317" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>