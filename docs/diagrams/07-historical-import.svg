<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1665" viewBox="0 0 1160 1665" role="img" aria-label="Historical patient import: gated workflow"><title>Historical patient import: gated workflow</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Historical patient import: gated workflow</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M510 234V290" marker-end="url(#arrow)"/><path class="edge" d="M510 394V437H150V480" marker-end="url(#arrow)"/><rect x="315.7" y="415" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="330" y="430" class="note">No</text><path class="edge" d="M510 394V437H870V480" marker-end="url(#arrow)"/><rect x="672.05" y="415" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="690" y="430" class="note">Yes</text><path class="edge" d="M870 584V640" marker-end="url(#arrow)"/><rect x="826.5" y="590" width="87" height="20" fill="#fffafd"/><text text-anchor="middle" x="870" y="605" class="note">clean only</text><path class="edge" d="M870 744V800" marker-end="url(#arrow)"/><path class="edge" d="M870 904V960" marker-end="url(#arrow)"/><path class="edge" d="M870 1064H1080V778H870V800" marker-end="url(#arrow)"/><rect x="1065.7" y="910" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="1080" y="925" class="note">No</text><path class="edge" d="M870 1064V1140" marker-end="url(#arrow)"/><rect x="852.05" y="1080" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="870" y="1095" class="note">Yes</text><path class="edge" d="M870 1244V1300" marker-end="url(#arrow)"/><path class="edge" d="M870 1404V1460" marker-end="url(#arrow)"/><path class="edge" d="M870 744V772H150V800" marker-end="url(#arrow)"/><rect x="437.3" y="750" width="145.4" height="20" fill="#fffafd"/><text text-anchor="middle" x="510" y="765" class="note">retention schedule</text><rect class="node"  x="370" y="130" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="510" y="176"><tspan x="510" dy="0">Active administrator opens</tspan><tspan x="510" dy="18">import</tspan></text><polygon class="node"  points="510,280 660,342 510,404 360,342"/><text class="label" text-anchor="middle" x="510" y="336"><tspan x="510" dy="0">Encryption key, scanner and</tspan><tspan x="510" dy="18">feature gate ready?</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="10" y="480" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="150" y="526"><tspan x="150" dy="0">Uploads disabled until</tspan><tspan x="150" dy="18">prerequisites pass</tspan></text><polygon class="node"  points="750,480 1010,480 990,584 730,584"/><text class="label" text-anchor="middle" x="870" y="526"><tspan x="870" dy="0">Synthetic CSV/XLSX upload;</tspan><tspan x="870" dy="18">limits and malware scan</tspan></text><rect class="node"  x="730" y="640" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="870" y="686"><tspan x="870" dy="0">Isolated parser; validate cells</tspan><tspan x="870" dy="18">and encrypt staging</tspan></text><rect class="node"  x="730" y="800" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="870" y="846"><tspan x="870" dy="0">Map columns, preview and review</tspan><tspan x="870" dy="18">duplicate decisions</tspan></text><polygon class="node"  points="870,950 1020,1012 870,1074 720,1012"/><text class="label" text-anchor="middle" x="870" y="1006"><tspan x="870" dy="0">All rows resolved and revision</tspan><tspan x="870" dy="18">current?</tspan></text><rect class="node"  x="730" y="1140" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="870" y="1186"><tspan x="870" dy="0">Lock job; transactional confirm</tspan><tspan x="870" dy="18">/ safe completed retry</tspan></text><path class="node"  d="M730 1318a140 18 0 0 1 280 0v68a140 18 0 0 1-280 0Z"/><ellipse cx="870" cy="1318" rx="140" ry="18" fill="#fce9f0" stroke="#85375e"/><text class="label" text-anchor="middle" x="870" y="1346"><tspan x="870" dy="0">patients + provenance + events</tspan><tspan x="870" dy="18">+ audit; commit or rollback</tspan></text><rect class="node"  x="730" y="1460" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="870" y="1506"><tspan x="870" dy="0">History; no Auth account or</tspan><tspan x="870" dy="18">automatic patient link</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="10" y="800" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="150" y="846"><tspan x="150" dy="0">TTL purges encrypted staging;</tspan><tspan x="150" dy="18">retain approved provenance</tspan></text><text x="30" y="1647" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>