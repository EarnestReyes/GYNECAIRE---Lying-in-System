<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1675" viewBox="0 0 1400 1675" role="img" aria-label="Staff avatar lifecycle: private Storage"><title>Staff avatar lifecycle: private Storage</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Staff avatar lifecycle: private Storage</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M510 234V290" marker-end="url(#arrow)"/><path class="edge" d="M510 394V437H150V480" marker-end="url(#arrow)"/><rect x="315.7" y="415" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="330" y="430" class="note">No</text><path class="edge" d="M510 394V437H870V480" marker-end="url(#arrow)"/><rect x="672.05" y="415" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="690" y="430" class="note">Yes</text><path class="edge" d="M870 584V640" marker-end="url(#arrow)"/><path class="edge" d="M870 744V800" marker-end="url(#arrow)"/><path class="edge" d="M870 904V960" marker-end="url(#arrow)"/><path class="edge" d="M870 1064V1107H510V1150" marker-end="url(#arrow)"/><rect x="675.7" y="1085" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="690" y="1100" class="note">No</text><path class="edge" d="M870 1064V1107H1210V1150" marker-end="url(#arrow)"/><rect x="1022.05" y="1085" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="1040" y="1100" class="note">Yes</text><path class="edge" d="M1210 1254V1310" marker-end="url(#arrow)"/><path class="edge" d="M1210 1414V1470" marker-end="url(#arrow)"/><rect class="node"  x="370" y="130" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="510" y="185"><tspan x="510" dy="0">Active staff edits own avatar</tspan></text><polygon class="node"  points="510,280 660,342 510,404 360,342"/><text class="label" text-anchor="middle" x="510" y="336"><tspan x="510" dy="0">Enabled, credential, decoder</tspan><tspan x="510" dy="18">and private bucket ready?</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="10" y="480" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="150" y="535"><tspan x="150" dy="0">Disabled; initials fallback</tspan></text><polygon class="node"  points="750,480 1010,480 990,584 730,584"/><text class="label" text-anchor="middle" x="870" y="526"><tspan x="870" dy="0">JPEG only, &lt;=3 MiB; decode /</tspan><tspan x="870" dy="18">dimensions / normalize</tspan></text><rect class="node"  x="730" y="640" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="870" y="677"><tspan x="870" dy="0">Own UUID/random UUID.jpg;</tspan><tspan x="870" dy="18">durable cleanup intent; private</tspan><tspan x="870" dy="18">upload</tspan></text><rect class="node"  x="730" y="800" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="870" y="846"><tspan x="870" dy="0">Lock own profile; update path +</tspan><tspan x="870" dy="18">audit transaction</tspan></text><polygon class="node"  points="870,950 1020,1012 870,1074 720,1012"/><text class="label" text-anchor="middle" x="870" y="1015"><tspan x="870" dy="0">Commit successful?</tspan></text><rect class="node"  x="370" y="1150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="510" y="1196"><tspan x="510" dy="0">Failure: retain cleanup intent;</tspan><tspan x="510" dy="18">no invalid profile pointer</tspan></text><rect class="node"  x="1070" y="1150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="1210" y="1196"><tspan x="1210" dy="0">Sign read URL;</tspan><tspan x="1210" dy="18">navigation/profile refresh</tspan></text><rect class="node"  x="1070" y="1310" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="1210" y="1347"><tspan x="1210" dy="0">Replace/remove: commit own path</tspan><tspan x="1210" dy="18">change; retry obsolete-object</tspan><tspan x="1210" dy="18">cleanup</tspan></text><rect class="node"  x="1070" y="1470" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="1210" y="1516"><tspan x="1210" dy="0">No avatar: initials; private</tspan><tspan x="1210" dy="18">objects never public</tspan></text><text x="30" y="1657" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>