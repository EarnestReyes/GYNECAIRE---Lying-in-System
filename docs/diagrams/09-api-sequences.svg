width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="310" y="181"><tspan x="310" dy="0">PUT clinic settings + JWT + expected_version</tspan></text><path class="edge" d="M470 301h100v35h-100" marker-end="url(#arrow)"/><rect x="340" y="259" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="550" y="277"><tspan x="550" dy="0">Verify JWT and active administrator</tspan></text><path class="edge" d="M470 397H790" marker-end="url(#arrow)"/><rect x="420" y="355" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="373"><tspan x="630" dy="0">BEGIN; advisory lock; lock/recheck admin</tspan></text><path class="edge" d="M470 493H790" marker-end="url(#arrow)"/><rect x="420" y="451" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="469"><tspan x="630" dy="0">Lock singleton; compare revision</tspan></text><path class="edge" d="M790 589H470" marker-end="url(#arrow)"/><rect x="420" y="547" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="565"><tspan x="630" dy="0">Mismatch / denial: ROLLBACK, 403/409</tspan></text><path class="edge" d="M470 685H790" marker-end="url(#arrow)"/><rect x="420" y="643" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="661"><tspan x="630" dy="0">Valid: parameterized upsert + audit</tspan></text><path class="edge" d="M470 781H790" marker-end="url(#arrow)"/><rect x="420" y="739" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="757"><tspan x="630" dy="0">COMMIT; any failure rolls back</tspan></text><path class="edge" d="M470 877H150" marker-end="url(#arrow)"/><rect x="100" y="835" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="310" y="853"><tspan x="310" dy="0">Return saved settings</tspan></text><path class="edge" d="M1110 973H470" marker-end="url(#arrow)"/><rect x="580" y="931" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="790" y="949"><tspan x="790" dy="0">GET /account/care + JWT</tspan></text><path class="edge" d="M470 1069H790" marker-end="url(#arrow)"/><rect x="420" y="1027" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="1045"><tspan x="630" dy="0">Derive patient from authenticated profile</tspan></text><path class="edge" d="M790 1165H470" marker-end="url(#arrow)"/><rect x="420" y="1123" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="630" y="1141"><tspan x="630" dy="0">Own appointments only, or no linked care</tspan></text><path class="edge" d="M470 1261H1110" marker-end="url(#arrow)"/><rect x="580" y="1219" width="420" height="31" fill="#fffafd"/><text class="label" text-anchor="middle" x="790" y="1237"><tspan x="790" dy="0">Return bounded own-care response</tspan></text></svg>