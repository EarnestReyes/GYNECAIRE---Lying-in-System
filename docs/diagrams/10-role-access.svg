<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1155" viewBox="0 0 1460 1155" role="img" aria-label="Role-based access: current authorization"><title>Role-based access: current authorization</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63334e"/></marker><marker id="many" markerWidth="14" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 8L13 1M0 8L13 8M0 8L13 15" fill="none" stroke="#63334e"/></marker></defs><rect width="100%" height="100%" fill="#fffafd"/><style>text{font-family:Arial,sans-serif;fill:#342033} .label{font-size:15px} .edge{stroke:#63334e;stroke-width:1.6;fill:none} .node{stroke:#85375e;stroke-width:1.6;fill:#fce9f0} .note{font-size:13px;fill:#634c5f}</style><text x="30" y="35" font-size="24" font-weight="bold">Role-based access: current authorization</text><text x="30" y="59" class="note">Current repository, 2026-10-30. Source implementation is not live workflow verification.</text><path class="edge" d="M530 254V350" marker-end="url(#arrow)"/><path class="edge" d="M900 254V350" marker-end="url(#arrow)"/><path class="edge" d="M900 454V550" marker-end="url(#arrow)"/><path class="edge" d="M900 654V702H530V750" marker-end="url(#arrow)"/><rect x="700.7" y="680" width="28.6" height="20" fill="#fffafd"/><text text-anchor="middle" x="715" y="695" class="note">No</text><path class="edge" d="M900 654V702H1270V750" marker-end="url(#arrow)"/><rect x="1067.05" y="680" width="35.9" height="20" fill="#fffafd"/><text text-anchor="middle" x="1085" y="695" class="note">Yes</text><rect class="node"  x="20" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="160" y="196"><tspan x="160" dy="0">Guest: public education and</tspan><tspan x="160" dy="18">onboarding</tspan></text><rect class="node"  x="390" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="530" y="196"><tspan x="530" dy="0">Authenticated general / linked</tspan><tspan x="530" dy="18">patient</tspan></text><rect class="node"  x="760" y="150" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="900" y="187"><tspan x="900" dy="0">Active staff membership: admin</tspan><tspan x="900" dy="18">/ midwife / nurse /</tspan><tspan x="900" dy="18">receptionist</tspan></text><rect class="node"  x="390" y="350" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="530" y="396"><tspan x="530" dy="0">Own preferences, verification;</tspan><tspan x="530" dy="18">linked patient care reads</tspan></text><rect class="node"  x="760" y="350" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="900" y="387"><tspan x="900" dy="0">Staff patients / appointments /</tspan><tspan x="900" dy="18">verification / reports / own</tspan><tspan x="900" dy="18">profile</tspan></text><polygon class="node"  points="900,540 1050,602 900,664 750,602"/><text class="label" text-anchor="middle" x="900" y="605"><tspan x="900" dy="0">Database role is admin?</tspan></text><rect class="node"  x="390" y="750" width="280" height="104" rx="48"/><text class="label" text-anchor="middle" x="530" y="796"><tspan x="530" dy="0">Nonadmin: deny privileged</tspan><tspan x="530" dy="18">writes</tspan></text><rect class="node"  x="1130" y="750" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="1270" y="796"><tspan x="1270" dy="0">Admin: clinic edits / staff</tspan><tspan x="1270" dy="18">access / gated imports</tspan></text><rect class="node" stroke-dasharray="6 4" fill-opacity="0.55" x="760" y="950" width="280" height="104" rx="4"/><text class="label" text-anchor="middle" x="900" y="987"><tspan x="900" dy="0">No Doctor role; no</tspan><tspan x="900" dy="18">clinical-chart, stock, message</tspan><tspan x="900" dy="18">or notification permissions yet</tspan></text><text x="30" y="1137" class="note">Legend: round = terminator; rectangle = process/entity; diamond = decision; slanted = input/output; cylinder = data; dashed = conditional/unavailable.</text></svg>